# PR과 dev·main push마다 백엔드·프론트 테스트를 돌린다. 배포는 하지 않는다(백엔드 이미지는 backend-image.yml)
name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle
            backend/gradle/wrapper/gradle-wrapper.properties
      # Testcontainers가 러너의 Docker로 PostgreSQL을 띄운다. 실제 geekhack·디스코드·Claude·R2는 부르지 않는다
      - run: ./gradlew test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          # 빌드에 들어가는 백엔드 주소. CI는 빌드가 되는지만 보므로 더미 값
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
