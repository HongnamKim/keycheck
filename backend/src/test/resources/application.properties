# 어떤 방법으로 테스트를 실행해도(IDE 포함) backend/.env 설정과 상관없이 실제 Claude API를 부르지 않는다.
# 요약 작업은 테스트가 직접 실행한다.
keycheck.summarizer=fake
keycheck.summary.enabled=false
# 다시 요약 설정은 테스트가 직접 정한다
keycheck.summary.redo-missing-product-name=false
# 미리 읽기는 실제 geekhack에 요청한다. 미리 읽기 작업도 테스트가 직접 실행한다.
keycheck.prefetch.enabled=false
# 테스트 글 번호(2000, 3000 등)는 실제 수집 기간 경계보다 작다. 경계를 보는 테스트만 따로 정한다.
keycheck.collect.since-topic-id=0
# backend/.env에 R2 키가 있어도 테스트는 R2를 부르지 않는다(저장소 빈이 없다). 축소본 작업도 테스트가 직접 실행한다.
keycheck.storage.endpoint=
keycheck.storage.bucket=
keycheck.storage.access-key-id=
keycheck.storage.secret-access-key=
keycheck.storage.public-url=https://img.test
keycheck.thumbnail.enabled=false
# backend/.env의 운영 항목(SPRINGDOC_ENABLED, KEYCHECK_CORS_ALLOWED_ORIGINS)이 테스트 결과를 바꾸지 않게 한다.
# Swagger는 변수 자리를 고정해야 SwaggerDisabledTest의 SPRINGDOC_ENABLED=false가 이긴다(springdoc.*.enabled를 고정하면 안 된다)
SPRINGDOC_ENABLED=true
keycheck.cors.allowed-origins=http://localhost:3000
