spring:
  application:
    name: keycheck
  config:
    # 로컬 비밀값(ANTHROPIC_API_KEY 등). bootRun은 backend/, IDE는 저장소 루트에서 실행될 수 있다
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/keycheck}
    username: ${DB_USERNAME:keycheck}
    password: ${DB_PASSWORD:keycheck}
    hikari:
      # 배포 DB(Supabase 세션 풀러)는 연결 수가 적어 운영은 5
      maximum-pool-size: ${DB_POOL_SIZE:10}
  task:
    scheduling:
      pool:
        # 정기 수집·요약·미리 읽기·축소본 작업과 공지 작업 셋(수집·보관·요약)이 서로 기다리지 않게 한다
        size: 7
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  # 끌 때 처리 중인 요청을 마치고 내린다
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # 상태 확인(/actuator/health)만 연다
        include: health
  endpoint:
    health:
      # DB 등 세부 항목은 숨기고 UP·DOWN만 알려 준다
      show-details: never

springdoc:
  paths-to-match: /api/**
  # 운영은 SPRINGDOC_ENABLED=false로 API 문서와 Swagger UI를 끈다
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}

keycheck:
  # fake | claude
  summarizer: ${SUMMARIZER:fake}
  claude:
    # 기본 Sonnet 5.5. 더 싸게는 claude-haiku-5-5 (KEYCHECK_CLAUDE_MODEL로 바꿀 수 있다)
    model: claude-sonnet-5-5
    effort: low
    # 생각(thinking)도 여기에 포함된다
    max-tokens: 8192
    timeout: 2m
    # 분류기가 거절하면 Anthropic이 권하는 다른 모델로 서버에서 다시 시도한다 (server-side fallbacks "default").
    # Haiku는 지원하지 않아 이 값과 상관없이 보내지 않는다
    fallbacks: true
  summary:
    # 요약 대기(PENDING) 글을 하나씩 요약하는 작업
    enabled: true
    interval: 5s
    # true면 가짜 요약기로 만든 요약(summarized_by = 'fake')도 다시 요약한다.
    # GB 글은 이 값과 상관없이 Claude 요약기면 공동구매 기간을 뽑으려고 다시 요약한다(기간을 뽑아 본 적 없거나 제목이 바뀐 글, 글당 약 1.1센트)
    redo-fake: false
    # true면 세부 분류가 없는 키보드·키캡 요약(Claude 요약 포함)도 다시 요약한다. 실행마다 글당 한 번. 가짜 요약기에서는 무시
    redo-missing-subcategory: false
    # 켜면 이름이 없는 요약 완료 글을 다시 요약한다. 글당 약 1.1센트, 켜기 전 확인.
    # 실행마다 글당 한 번(AI가 이름을 모르는 글과 다시 요약에 실패한 글은 재시작할 때마다 다시 요약한다. 실패해도 요약은 그대로). 가짜 요약기에서는 무시
    redo-missing-product-name: false
    # 하루(한국 시간 자정 기준)에 Claude 요약기를 부르는 상한(글 탓 실패·연결 실패·시간 초과 포함, 과금되지 않는 API 오류 응답은 빼고).
    # 닿으면 다음 날까지 쉰다. 메모리에서 세므로 재시작하면 0부터 센다(최종 안전망은 Anthropic 월 지출 한도). 가짜 요약기에서는 무시
    daily-limit: 2000
  crawl:
    # 켜면 기동 직후와 이후 interval마다 실제 geekhack에 요청한다
    enabled: ${CRAWL_ENABLED:false}
    interval: PT30M
  prefetch:
    # 켜면 틀 글을 하나씩 실제 geekhack에서 읽는다. 채운 글은 요약 작업이 요약하므로 SUMMARIZER=claude면 글당 약 1.1센트
    enabled: ${PREFETCH_ENABLED:false}
    interval: 10s
  fill:
    # 틀 글 채우기(상세 열기·미리 읽기)를 동시에 하는 상한. 넘치면 기다리지 않고 틀 그대로 돌려준다(서버 스레드가 묶이지 않게)
    max-concurrent: 3
    # 상세 열기에서 채우기에 실패한 글은 이 시간 동안 geekhack에 다시 요청하지 않고 틀 그대로 돌려준다(미리 읽기는 따로 실패 횟수를 센다)
    failure-cooldown: 10m
  stats:
    # 상세 화면 조회수 갱신이 한 시간(정각 기준) 동안 geekhack에 요청하는 상한. 다 쓰면 저장값을 준다
    hourly-budget: 60
    # 마지막 댓글(없으면 작성일)이 inactive-after보다 오래된 글은 inactive-interval마다만 갱신한다(그 밖의 글은 1시간)
    inactive-after: 30d
    inactive-interval: 24h
  collect:
    # 이 글 번호 이상인 글만 모으고 보여 준다. 2020-01-01 무렵 첫 글 번호.
    # DB의 작성일 기준점(102599 = 2019-09-24, 112165 = 2021-04-07)으로 보간한 추정값이며 며칠 오차는 괜찮다.
    # 값을 낮추면 경계에 닿아 끝으로 둔 게시판이 다시 확보되도록 update board_backfill set exhausted = false; 를 실행한다
    since-topic-id: 104300
  storage:
    # Cloudflare R2(S3 호환). 비면 축소본 작업이 돌지 않고 화면은 원본을 쓴다
    endpoint: ${R2_ENDPOINT:}
    bucket: ${R2_BUCKET:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    # 브라우저가 축소본을 받는 공개 주소 앞부분. 로컬은 버킷의 r2.dev 주소, 배포는 연결한 도메인
    public-url: ${R2_PUBLIC_URL:}
  thumbnail:
    # 켜면 이미지 원본을 실제 이미지 호스트·geekhack에서 받아 축소본을 R2에 올린다. 저장소(R2_*) 설정이 없으면 돌지 않는다
    enabled: ${THUMBNAIL_ENABLED:false}
    interval: 3s
  cors:
    # 브라우저에서 백엔드를 부르는 프론트 주소(쉼표로 여러 개). placeholder로 두어 .env 파일에서도 적용된다
    allowed-origins: ${KEYCHECK_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  geekhack:
    base-url: https://geekhack.org
    user-agent: "keycheck/0.1 (+https://github.com/HongnamKim/keycheck)"
    min-interval: 2s
    time-zone: America/Chicago
  notice:
    # 디스코드 판매 공지 수집·보관 작업
    enabled: ${NOTICE_ENABLED:false}
    interval: 5m
    bot-token: ${DISCORD_BOT_TOKEN:}
    api-base-url: https://discord.com/api/v10
    user-agent: "DiscordBot (https://github.com/HongnamKim/keycheck, 0.1)"
    # 판매처별 채널 id. 비면 그 판매처는 수집하지 않는다
    channels:
      SWAGKEYS: ${SWAGKEY_CHANNEL_ID:}
      GEONWORKS: ${GEONWORKS_CHANNEL_ID:}
    attach-window: 24h
    archive:
      interval: 3s
    summary:
      # 로컬에서 가져온 샘플을 확인 없이 Claude로 요약하지 않게 기본은 끔. 운영 env에서 true
      enabled: ${NOTICE_SUMMARY_ENABLED:false}
      interval: 5s
      wait: 10m
    import:
      dir: ${NOTICE_IMPORT_DIR:}
      vendor: ${NOTICE_IMPORT_VENDOR:}
