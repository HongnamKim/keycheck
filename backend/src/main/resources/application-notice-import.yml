# 지난 공지 가져오기(NoticeImportRunner)용. 웹 서버 없이 한 번 실행하고 끝난다.
# 서버 env_file에 CRAWL_ENABLED=true 등이 있어도 모든 작업을 끈다(프로필 파일 값이 application.yml의 placeholder보다 앞선다).
spring:
  main:
    web-application-type: none
    banner-mode: off

keycheck:
  crawl:
    enabled: false
  prefetch:
    enabled: false
  thumbnail:
    enabled: false
  summary:
    enabled: false
  notice:
    enabled: false
    summary:
      enabled: false
